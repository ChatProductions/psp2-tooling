name: VitaPlay v11 v7-video manual Bluetooth audio

on:
  push:
    branches:
      - experiment/vitaplay-v11-v7-manual-bt-audio-20261117
    paths:
      - .github/workflows/vitaplay-audio-test.yml
      - vitaplay-audio-test/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:2026.08
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Build VitaPlay from upstream C source
        shell: bash
        run: bash vitaplay-audio-test/build.sh
      - name: Package VitaPlay v9 with the matching kernel plugin
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import hashlib
          vpk=Path("out/VitaPlay-v11-V7-Video-Manual-BTAudio.vpk")
          assert vpk.is_file()
          with ZipFile(vpk) as z:
              assert z.testzip() is None
              plugin=z.read("vitaplaybt.skprx")
              assert "eboot.bin" in z.namelist()
          companion=Path("upstream/vitaplay/btplugin/vitaplaybt.skprx").read_bytes()
          assert plugin==companion, "VPK plugin mismatch"
          elf=Path("upstream/vitaplay/btplugin/build/vitaplaybt.elf").read_bytes()
          assert b"vpbt_audio_read" in elf, "hybrid packet reader absent"
          assert b"v10 BT RTP" in elf, "prequeue RTP diagnostic absent"
          eboot=Path("upstream/vitaplay/build/VitaPlay.elf").read_bytes()
          assert b"v11 MANUAL SBC ENABLE" in eboot, "manual activation not compiled"
          assert b"vpbt_audio_enable" in elf, "manual kernel capture toggle absent"
          out=Path("out/VitaPlay-v11-V7-Video-Manual-BTAudio-Test.zip")
          with ZipFile(out,"w",compression=ZIP_DEFLATED) as z:
              z.write(vpk,vpk.name)
              z.writestr("vitaplaybt.skprx",plugin)
              z.write("vitaplay-audio-test/README-v11.md","README.md")
              z.write("upstream/vitaplay/vendor/libsbc/LICENSE","Google-libsbc-LICENSE")
          with ZipFile(out) as z: assert z.testzip() is None
          print("VitaPlay v9 ZIP",out,out.stat().st_size)
          print("plugin_sha256",hashlib.sha256(plugin).hexdigest())
          PY
      - name: Upload compiled VPK and complete hybrid ZIP
        uses: actions/upload-artifact@v4
        with:
          name: VitaPlay-v11-V7-Video-Manual-BTAudio
          path: |
            out/*.vpk
            out/*.zip
          if-no-files-found: error
