name: VitaPlay v8 Bluetooth to WiFi audio handoff

on:
  push:
    branches:
      - experiment/vitaplay-wifi-audio-v8-bthandoff-20261117
    paths:
      - .github/workflows/vitaplay-audio-test.yml
      - vitaplay-audio-test/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:2026.08
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Build VitaPlay from upstream C source
        shell: bash
        run: bash vitaplay-audio-test/build.sh
      - name: Bundle and validate VPK plus matching Bluetooth kernel plugin
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import hashlib
          vpk=Path("out/VitaPlay-v8-wifi-audio-handoff.vpk")
          assert vpk.is_file()
          with ZipFile(vpk) as z:
              assert z.testzip() is None
              plugin=z.read("vitaplaybt.skprx")
              kernel_elf=Path("upstream/vitaplay/btplugin/build/vitaplaybt.elf").read_bytes()
              assert b"v8 Wi-Fi handoff" in kernel_elf
              assert b"vpbt_handoff_disconnect" in kernel_elf
              assert b"eboot.bin" in z.namelist()
          standalone=Path("upstream/vitaplay/btplugin/vitaplaybt.skprx").read_bytes()
          assert plugin==standalone, "VPK kernel plugin differs from built plugin"
          output=Path("out/VitaPlay-v8-Bluetooth-WiFi-Audio-Test.zip")
          with ZipFile(output,"w",compression=ZIP_DEFLATED) as z:
              z.write(vpk,vpk.name)
              z.writestr("vitaplaybt.skprx",plugin)
              z.write("vitaplay-audio-test/README-v8.md","README.md")
          with ZipFile(output) as z: assert z.testzip() is None
          print("VPK:",vpk.stat().st_size,"plugin sha256:",hashlib.sha256(plugin).hexdigest())
          print("ZIP:",output,output.stat().st_size)
          PY
      - name: Upload VPK and plugin test ZIP
        uses: actions/upload-artifact@v4
        with:
          name: VitaPlay-v8-Bluetooth-WiFi-Audio-Test
          path: |
            out/*.zip
            out/*.vpk
          if-no-files-found: error
